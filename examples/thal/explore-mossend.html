<style>
/* Portrait-first battle map in the flat vector look of the scene art: a turn-order strip of big portraits on top,

:root{

  --party:#2E3A66; --ally:#3E6B6A; --foe:#B4463E; --neutral:#C99A4A; --gold:#E8C15A; --hpbar:#5C7F4F; --hplow:#DD8E73; --track:#E9D8C8;

  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#241915; --panel:#30231D; --line:#4A3830; --ink:#F3E4D6; --mute:#C2AA9A; --track:#4A3830; --ally:#6F9590; --party:#4A5AA0; color-scheme:dark;}}
:root[data-theme="dark"]{--ground:#241915; --panel:#30231D; --line:#4A3830; --ink:#F3E4D6; --mute:#C2AA9A; --track:#4A3830; --ally:#6F9590; --party:#4A5AA0; color-scheme:dark;}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
.wrap{max-width:1360px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
html,body{overflow-x:hidden}
.wrap>*{min-width:0}
header{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,4vw,2.4rem);line-height:1.05;margin:0}
.round{font-family:var(--display);background:var(--ink);color:var(--ground);border-radius:999px;padding:2px 12px;font-size:.95rem}
.status{color:var(--mute);flex-basis:100%}
.status b{color:var(--ink)}

/* turn order strip */
.striplabel{margin-bottom:-14px}
.strip{display:flex;gap:12px;overflow-x:auto;padding:14px 4px 8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
/* Characters page (view: characters): the cast as a wrapping grid, no map */
.strip.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));overflow:visible;gap:14px 12px}
.strip.grid .tc{width:auto}
.tc{flex:none;width:168px;align-content:start;scroll-snap-align:start;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:12px 10px 10px;display:grid;justify-items:center;gap:6px;cursor:pointer;position:relative;text-align:center;transition:transform .2s}
.tc:hover,.tc:focus-visible{transform:translateY(-3px);outline:none}
.tc .pic{width:96px;height:96px;border-radius:50%;overflow:hidden;border:4px solid var(--side);display:grid;place-items:center;background:var(--line);font:800 1.5rem var(--body);color:var(--ink)}
.tc .pic img{width:100%;height:100%;object-fit:cover;display:block}
.tc .nm{font-weight:800;font-size:.95rem;line-height:1.15}
.tc .rl{font-size:.74rem;color:var(--mute);line-height:1.2;margin-top:-4px}
.tc .tn{font-size:.76rem;line-height:1.3;color:var(--ink);opacity:.8;text-align:left;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.chip.fx{background:color-mix(in srgb,var(--ally) 16%,var(--ground));border-color:var(--ally);color:var(--ink);font-weight:700}
.tc .meta{font-size:.75rem;color:var(--mute);font-variant-numeric:tabular-nums;margin-top:-2px}
.shnote{margin:0;padding:10px 16px 0;color:var(--mute);font-size:.92rem}
.tc .ord{position:absolute;top:-10px;left:-8px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--ground);display:grid;place-items:center;font:800 .85rem var(--body)}
.tc.now{width:196px;box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 40%,transparent)}
.tc.now .pic{width:124px;height:124px}
.tc.now::after{content:"Now acting";position:absolute;top:-12px;right:-6px;background:var(--gold);color:#2B1B17;font:800 .7rem var(--body);letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px}
.tc.sel:not(.now){border-color:var(--side)}
.tc.done{opacity:.75}
.tc.down .pic img{filter:grayscale(1);opacity:.6}
.bar{width:100%;height:8px;border-radius:999px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--hpbar);border-radius:999px}
.bar i.low{background:var(--hplow)}
.hpn{font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--mute);margin-top:-4px}
.tc .pw{position:relative;display:grid;justify-items:center}
.tc .cb{position:absolute;bottom:-6px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:1px 7px;font:800 .72rem var(--body);font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap;line-height:1.35}
.tc{border-color:var(--side)!important;background:color-mix(in srgb,var(--side) 9%,var(--panel));padding-top:0;overflow:visible}
.tc .band{justify-self:stretch;margin:0 -10px 6px;padding:5px 8px;border-radius:15px 15px 0 0;background:var(--side);color:#fff;font:800 .72rem var(--body);letter-spacing:.08em;text-transform:uppercase}
.tc.now .band{border-radius:13px 13px 0 0}
.tc.k-neutral .band{color:#2B1B17}
.tc .cb.loc{left:-14px}.tc .cb.ac{right:-14px}
.tc .cnt{position:absolute;top:-4px;right:-12px;background:var(--ink);color:var(--ground);font:800 .8rem var(--body);border-radius:999px;padding:2px 8px}
.hp{position:relative;width:100%;height:20px;border-radius:999px;background:var(--track);overflow:hidden;margin-top:2px}
.hp i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--hpbar)}
.hp.mid i{background:#C99A4A}.hp.low i{background:var(--foe)}
.hp b{position:relative;display:block;text-align:center;font:800 .74rem/20px var(--body);font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.75),0 0 1px rgba(0,0,0,.9)}
.word{font-size:.78rem;font-weight:800;border-radius:999px;padding:2px 10px;background:var(--foe);color:#fff}
.word.w0{background:#7E9A62}.word.w1{background:#C99A4A}.word.w2{background:#DD8E73}.word.w3{background:#B4463E}.word.w4{background:#6E655D}
.chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.chip{font-size:.7rem;border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--mute);background:var(--ground)}
.chip.cond,.pill.cond{background:#B4463E;border-color:#B4463E;color:#fff;font-weight:800}
.pill.fx{background:color-mix(in srgb,var(--ally) 16%,var(--ground));border-color:var(--ally);color:var(--ink)}

.main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media (max-width:920px){.main{grid-template-columns:minmax(0,1fr)}}
.mapcol{display:grid;gap:8px;min-width:0}
.sqbar{margin:0;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;color:var(--mute);font-size:.92rem}
.sqname{font:800 1rem var(--body);background:var(--ink);color:var(--gold);border-radius:999px;padding:2px 12px}
.mapbox{overflow-x:auto;background:var(--mapbg);border-radius:18px;padding:10px;-webkit-overflow-scrolling:touch}
svg#map{cursor:crosshair;display:block;width:100%;min-width:780px;height:auto;touch-action:manipulation;user-select:none;border-radius:8px}
aside{display:grid;gap:14px;min-width:0}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:10px;min-width:0}
.label{font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.spot{justify-items:center;text-align:center}
.spot .big{width:min(240px,70vw);aspect-ratio:1;border-radius:50%;overflow:hidden;border:6px solid var(--side);display:grid;place-items:center;background:var(--line);font:800 3rem var(--body)}
.spot .big img{width:100%;height:100%;object-fit:cover;display:block}
.spot.now .big{border-color:var(--gold);box-shadow:0 0 0 6px color-mix(in srgb,var(--gold) 35%,transparent)}
.spot h2{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0;line-height:1.1}
.spot .role{color:var(--mute);margin-top:-6px}
.stats{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pill{font-size:.84rem;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums;background:var(--ground)}
.note{color:var(--mute);font-size:.92rem;margin:0;text-align:left}
.back{font:800 .85rem var(--body);color:var(--ally);background:none;border:0;cursor:pointer;text-decoration:underline;padding:0}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px 10px}
.legend div{display:flex;gap:8px;align-items:center;font-size:.86rem;min-width:0}
.sw{width:30px;height:30px;box-sizing:border-box;border-radius:4px;flex:none}
.tile{width:30px;height:30px;flex:none;display:block;border-radius:3px;box-shadow:0 0 0 1px rgba(43,27,23,.25)}
.hint{margin:0;color:var(--mute);font-size:.88rem}
/* character sheet panel: tap a party member to open it */
.sheetbtn{font:800 .9rem var(--body);background:var(--ally);color:#fff;border:0;border-radius:999px;padding:8px 18px;cursor:pointer}
dialog#sheet{border:0;padding:0;background:var(--panel);color:var(--ink);border-radius:22px;width:min(560px,calc(100vw - 24px));max-height:min(88vh,860px);box-shadow:0 18px 60px rgba(0,0,0,.45)}
dialog#sheet::backdrop{background:rgba(30,20,16,.55)}
@media (max-width:620px){dialog#sheet{width:100vw;max-width:100vw;max-height:88vh;margin:auto 0 0;border-radius:22px 22px 0 0}}
.sh{display:flex;flex-direction:column;max-height:inherit;overflow-y:auto;-webkit-overflow-scrolling:touch}
.shhead{display:flex;gap:14px;align-items:center;padding:16px 16px 10px;border-bottom:2px solid var(--line)}
.shhead .pic{width:72px;height:72px;flex:none;border-radius:50%;overflow:hidden;border:4px solid var(--ally);background:var(--line)}
.shhead .pic{display:grid;place-items:center;font-size:2.2rem}
.shhead .pic img{width:100%;height:100%;object-fit:cover;display:block}
.shhead h2{font-family:var(--display);font-weight:400;font-size:1.5rem;line-height:1.05;margin:0}
.shhead .sub{color:var(--mute);font-size:.88rem}
.shhead .x{margin-left:auto;align-self:flex-start;width:40px;height:40px;flex:none;border-radius:50%;border:2px solid var(--line);background:var(--ground);color:var(--ink);font:800 1.1rem var(--body);cursor:pointer}
.shstats{display:flex;flex-wrap:wrap;gap:5px;padding:10px 16px 0}
.shstats .pill{font-size:.78rem}
.tabs{display:flex;gap:6px;padding:12px 16px 8px;position:sticky;top:0;z-index:2;background:var(--panel)}
.tabs button{flex:1;min-width:0;font:800 .8rem var(--body);border:2px solid var(--line);background:var(--ground);color:var(--mute);border-radius:999px;padding:8px 6px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.shbody{padding:6px 16px 22px;display:grid;gap:12px}
.shbody h3{font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:6px 0 0}
.slots{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:.88rem;font-weight:700}
.pips{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.pips i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ally);display:block}
.pips i.on{background:var(--ally)}
.cast{color:var(--mute);font-size:.86rem;margin:0}
.it{background:var(--ground);border:1px solid var(--line);border-radius:12px}
.it summary,.it .row{list-style:none;cursor:pointer;padding:9px 12px;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.it .row{cursor:default}
.it summary::-webkit-details-marker{display:none}
.it summary::after{content:"+";margin-left:auto;color:var(--mute);font-weight:800}
.it[open] summary::after{content:"–"}
.it .n{font-weight:800}
.it .tg{font-size:.78rem;color:var(--mute)}
.it .slot{font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ally);flex-basis:100%}
.it .use{font-size:.78rem;font-weight:800;color:var(--ally);font-variant-numeric:tabular-nums}
.it .use.out{color:var(--foe)}
.it p{margin:0;padding:0 12px 10px;color:var(--mute);font-size:.9rem}
.now-fx{display:grid;gap:6px}
.now-fx .it{border-left:5px solid var(--ally)}
.now-fx .it.c{border-left-color:#B4463E}
.packbtn{font:800 .85rem var(--body);background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:3px 12px;cursor:pointer;align-self:center}
.packlink{font:800 .9rem var(--body);background:var(--ground);color:var(--ally);border:2px dashed var(--line);border-radius:12px;padding:10px;cursor:pointer;text-align:left}
.left{display:grid;gap:8px;background:var(--ground);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.rescount{display:flex;flex-wrap:wrap;gap:6px}
.rc{font-size:.8rem;font-weight:800;border-radius:999px;padding:2px 10px;background:color-mix(in srgb,var(--ally) 16%,var(--panel));color:var(--ink);font-variant-numeric:tabular-nums}
.rc.out{background:var(--track);color:var(--mute);text-decoration:line-through}
.it .lv{font-size:.68rem;font-weight:800;letter-spacing:.04em;border-radius:999px;padding:1px 7px;background:var(--ink);color:var(--ground)}
.it .why{font-size:.72rem;font-weight:800;border-radius:999px;padding:1px 8px;background:var(--track);color:var(--mute)}
.it.off{opacity:.55;border-style:dashed}
.it.off .n{text-decoration:line-through;text-decoration-thickness:1px}
.book{border:2px dashed var(--line);border-radius:14px;padding:4px 10px 10px;display:grid;gap:8px}
.book>summary{cursor:pointer;font-weight:800;padding:8px 2px;color:var(--mute);list-style:none}
.book>summary::-webkit-details-marker{display:none}
.book .it.off .n{text-decoration:none}
.hero{margin:0;border-radius:18px;overflow:hidden;background:var(--line)}
.hero img{display:block;width:100%;height:auto}
.jcard{gap:8px}
.jcard h2{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0}
.jline{display:flex;gap:8px;align-items:baseline;font-size:.92rem}
.jline b{white-space:nowrap}
.jcard>*{min-width:0}
.jline span{color:var(--mute);min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it .next{display:block;margin:0 12px 10px;padding:6px 10px;border-radius:10px;background:color-mix(in srgb,var(--gold) 22%,var(--panel));font-size:.88rem;color:var(--ink)}
.it .where{display:block;margin:-4px 12px 10px;font-size:.8rem;color:var(--mute)}
.faces{display:flex;gap:4px;margin:0 12px 10px}
.faces img{width:34px;height:34px;border-radius:50%;border:2px solid var(--ally);object-fit:cover}
.asof{color:var(--mute);font-size:.78rem;margin:4px 0 0}
@keyframes halo{0%,100%{opacity:.9}50%{opacity:.35}}
.halo{animation:halo 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const JOURNAL = {"_about": "Scene map journal. PLAYER-FACING ONLY: what Thal knows, no DM secrets, nothing from .dm/. Update after scenes that change a quest. Each entry: title, icon, text (what Thal knows), next (next step), where, people (portrait ids from portraits/flat/, shown as small faces), status: active | done. Loose ends = open threads Thal noticed but hasn't followed up (scope still TBD with Thanawat). Growth rules (Oct 25): only active entries show open. status 'hold' folds into On hold. Loose ends show the newest `loose_limit` (6), newest first in the list; older ones fold away automatically. Resolved loose ends are deleted (or become a quest). Done entries carry `chapter` and fold per chapter; when a main-quest chapter ends, squash its Done list into one summary line.", "asof": "Day 21, late morning (the drowned mill)", "main": [{"title": "The Drowning Night", "icon": "🌑", "status": "active", "text": "Granny Rush: on the dark of the moon (tomorrow night, day 22) Sedge will go to the Drowned Ring to wake her sisters, Moss and Weed. She needs the Warden dead, or innocent voices singing the twisted lullaby at the Ring: the children with the threads.", "next": "Protect the children and the Warden; gather voices who know the true verse; meet Bors in Mossend.", "where": "The Drowned Ring", "people": ["lady_pell"]}, {"title": "The missing children of the Reedmarch", "icon": "⭐", "status": "active", "text": "Cal (Wren's brother), Pip (Agna's granddaughter), Dobb, Moll and Fen were taken from the reed villages and caged at the Drowned Ring. On day 18 the party freed all five; Pip's ribbon broke the Ring's charm on her. Lady Pell was Mother Sedge, a green hag, all along, and her horn has sounded: she knows the cages are empty.", "next": "All five are safe in Mossend. Cal and Pip are with family; Dobb, Moll and Fen still need taking home to their villages.", "where": "Mossend", "people": ["wren", "cal", "pip", "dobb", "moll", "fen", "teal"]}, {"title": "Keep the Old One alive", "icon": "🐢", "status": "active", "text": "The Old Warden lies on \"the three below\". If it dies, they rise, and Lady Pell wants exactly that. The Pikes have turned and won't hunt it, but its neck wound from Pell's riders still bleeds.", "next": "Make sure no new hunters reach the wallow. Pell has sent a purse to Pell's Landing to hire more swords, maybe arriving by tomorrow night.", "where": "The Old One's wallow, Sunk Mire", "people": ["bors", "lady_pell"]}, {"title": "Show the Reedmarch who Lady Pell really is", "icon": "🪞", "status": "active", "text": "Bors wants public proof before he moves against her: the children themselves, or her true face. She goes down to the undercroft alone every night without a light, and the key is always on her belt. The children's shoes were seen down there. Day 20: Varrick, captain of Pell's Grey Hounds, carried written orders under her green P seal: bring the five back living, and burn Mossend if they didn't come.", "next": "Bors is on his way (Pim rode for him). Granny Rush says Sedge keeps the mirrors at Pell Hall draped because an old tale says plain glass or still water shows a hag's true face.", "where": "Pell Hall", "people": ["lady_pell", "corlis", "bors"]}], "side": [{"title": "The missing verse", "icon": "🎶", "status": "active", "text": "Gran's lullaby opened the shrine at the old stones. Granny Rush of the drowned mill sang the missing verse on day 21: \"Sink, sisters, sink, where the black stones go, / Moss and Weed and Sedge, lie still, lie low. / Root on root and shell on stone, / Sleep, Warden, sleep, you do not sleep alone.\"", "next": "Granny Rush says: sung over a thread-touched child by their own kin, it cuts the thread. Sung by many voices at the Drowned Ring, the Warden wakes strong and the sisters' shared magic falters.", "where": "The drowned mill", "people": ["wren"]}, {"title": "Bring Cal home to Hesper", "icon": "🏠", "status": "active", "text": "Hesper Fennick, reeve of Fennick's Reach and Wren's mother, asked Thal to bring her boy home. She promised him a roof in the Reedmarch.", "next": "Cal is safe in Mossend with Wren. Take him on home to Fennick's Reach.", "where": "Fennick's Reach", "people": ["wren"]}, {"title": "Bring Pip home to Agna", "icon": "🏠", "status": "done", "text": "Agna Rusk, reeve of Mossend: \"Bring my Pip home. All of them. And mind the water when it sings.\" Day 20: Pip is home with Agna.", "next": "Rescue Pip from the Drowned Ring.", "where": "Mossend", "people": ["agna"], "chapter": "Main quest 2"}, {"title": "The last Choir cells", "icon": "🔥", "status": "active", "text": "Before he died, Corvin named the Choir's paymaster, Hollin of the Cinder Inn at Sallow Ford, and two cells farther east: the Ashwell chapel at Varn, and Orrin, a smith in Kettleby.", "next": "Nothing planned yet.", "where": "Varn and Kettleby, to the east", "people": []}, {"title": "Find Familiar", "icon": "🦉", "status": "done", "text": "Thal has the charcoal, herbs and brass brazier for Find Familiar. He's still missing the incense. Odda doesn't stock any. Day 21: Granny Rush gave Thal resin incense. The set is complete (charcoal, herbs, incense, brazier).", "next": "Cast it as a ritual (1 hour) when there's time.", "where": "Mossend", "people": ["odda"], "chapter": "Main quest 2"}], "loose": [{"title": "Pell's mirror and the green bead", "icon": "🪞", "status": "active", "text": "Thal carries Pell's silver scrying glass, knotted in black silk, and the bead that kept Tamsin charmed. The bead hums the water-song. When uncovered, the Lady can look through the glass.", "people": []}, {"title": "Wren's fish whistle", "icon": "🐟", "status": "active", "text": "The little wooden fish Wren carved for Cal was found in Pell's cart. Pim hung it on the nail by his bunk in the Pell Hall stable loft.", "people": ["wren"]}, {"title": "The singing under the kitchen floor", "icon": "🎵", "status": "active", "text": "Pell Hall's servants hear singing come up through the kitchen floor at night. Cook says it's the drains.", "people": []}, {"title": "Lamp oil from Pell's Landing", "icon": "🏺", "status": "active", "text": "The mire brute's oil jars were stamped TOLLY · PELL'S LANDING, with a candle-and-anchor chandler's mark.", "people": []}, {"title": "The Hound who got away", "icon": "🌊", "status": "active", "text": "One of Varrick's Grey Hounds swam off west from Mossend into the dark on day 20. He'll likely run to Pell.", "people": ["grey_hounds"]}, {"title": "Varrick's grey bundle", "icon": "🪞", "status": "active", "text": "A hag's hand mirror like Pell's silver glass. Its eye is blind while wrapped, but its hum is a lure that tugs at the rescued children. Thal hid it, wrapped in extra layers, in Mossend's burned stilt house.", "people": ["varrick", "agna"]}, {"title": "Brackwater landing", "icon": "🛶", "status": "active", "text": "Varrick's orders said to bring the children to Brackwater landing, not to the Hall.", "people": ["varrick"]}, {"title": "Threads on the children", "icon": "🧵", "status": "active", "text": "Detect Magic showed a faint enchantment thread, left by the Ring's song, on Moll, Dobb and Fen (Cal was out of range). Pip has none: her ribbon glows with abjuration, but it did nothing for Moll. The threads went slack once the bundle was moved away.", "next": "Have each child's kin sing the true verse over them: Moll and Fen's family at Tern Hollow, Dobb's at Gulley's Wick, Wren for Cal.", "people": ["moll", "dobb", "fen", "pip"]}], "done": [{"title": "Main quest 1: the Frostmantle shards", "icon": "❄️", "text": "All three Ember shards destroyed. Corvin is dead (day 9).", "chapter": "The Frostmantle shards", "people": []}, {"title": "Rescued Tamsin from Pell Hall's tower", "icon": "🗼", "text": "Day 14. Her charm broke once the bead came off.", "chapter": "The Reedmarch", "people": []}, {"title": "Stood between the Old One and the spears", "icon": "🐢", "text": "Day 15. Bors and most of the Pikes grounded their pikes and turned against Pell.", "chapter": "The Reedmarch", "people": []}, {"title": "Unmasked the Beast of Mossend", "icon": "🐊", "text": "Day 12. It was a mire brute in disguise, sent by whoever watched through the mirror.", "chapter": "The Reedmarch", "people": []}], "loose_limit": 6}; // quest journal from journal.json (what the hero knows)

for (const [c, n] of [['#3E6B6A', 'Party ring'], ['#B4463E', 'Foe ring'], ['#C99A4A', STATE.neutralLabel || 'Others'], ...(EXPLORE ? [] : [['#E8C15A', 'Whose turn it is']])]) { const d = document.createElement('div'); d.innerHTML = '<span class="sw"></span><span></span>'; d.firstChild.style.cssText = `background:transparent;border:3px solid ${c};border-radius:50%`; d.lastChild.textContent = n; lg.appendChild(d); }
